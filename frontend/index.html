<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>兆豐理賠申請（測試系統）</title>
<style>
  :root {
    --ink: #16232e;
    --ink-soft: #4a5b68;
    --line: #d8dee2;
    --surface: #ffffff;
    --page: #f3f6f7;
    --accent: #0f5c56;
    --accent-soft: #e3efed;
    --warn-bg: #fdf3e3;
    --warn-ink: #7a4a06;
    --err-bg: #fbeaea;
    --err-ink: #8a2c22;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-family: -apple-system, "Noto Sans TC", "PingFang TC", sans-serif;
    line-height: 1.6;
  }
  .page-layout {
    max-width: 1040px; margin: 0 auto; padding: 32px 20px 80px;
    display: flex; align-items: flex-start; gap: 24px;
  }
  .shell { max-width: 640px; flex: 1 1 auto; min-width: 0; }

  .demo-sidebar { width: 260px; flex: 0 0 260px; position: sticky; top: 24px; }
  .demo-card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px;
  }
  .demo-card .demo-badge {
    display: inline-block; font-size: 11px; letter-spacing: .04em;
    background: var(--accent-soft); color: var(--accent);
    padding: 3px 9px; border-radius: 999px; margin-bottom: 10px; font-weight: 600;
  }
  .demo-card h2 { font-size: 15px; margin: 0 0 6px; }
  .demo-card .demo-hint { font-size: 12px; color: var(--ink-soft); margin: 0 0 14px; }
  .demo-list { display: flex; flex-direction: column; gap: 8px; }
  .demo-item {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: var(--page); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font-family: inherit; color: var(--ink);
  }
  .demo-item:hover { border-color: var(--accent); }
  .demo-item.active { border-color: var(--accent); background: var(--accent-soft); }
  .demo-item .demo-item-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .demo-item .demo-item-desc { font-size: 11.5px; color: var(--ink-soft); line-height: 1.4; }
  .demo-tag {
    display: inline-block; font-size: 10.5px; font-weight: 600; letter-spacing: .02em;
    padding: 2px 7px; border-radius: 999px; margin-bottom: 6px;
  }
  .demo-tag.approve { background: var(--accent-soft); color: var(--accent); }
  .demo-tag.review { background: var(--warn-bg); color: var(--warn-ink); }
  .demo-tag.incomplete { background: var(--err-bg); color: var(--err-ink); }
  .demo-reset {
    width: 100%; margin-top: 12px; padding: 9px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft);
    font-size: 12.5px; cursor: pointer; font-family: inherit;
  }
  .demo-reset:hover { border-color: var(--ink-soft); }

  @media (max-width: 860px) {
    .page-layout { flex-direction: column; }
    .demo-sidebar { width: 100%; flex: 1 1 auto; position: static; }

  header.top { margin-bottom: 28px; }
  header.top .badge {
    display: inline-block; font-size: 12px; letter-spacing: .04em;
    background: var(--warn-bg); color: var(--warn-ink);
    padding: 4px 10px; border-radius: 999px; margin-bottom: 12px;

  header.top p { color: var(--ink-soft); margin: 0; font-size: 14px; }

  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 24px; margin-bottom: 20px;
  }
  .field { margin-bottom: 18px; }
  .field label {
    display: block; font-size: 13px; font-weight: 600;
    color: var(--ink-soft); margin-bottom: 6px;
  }
  .field input, .field select, .field textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 8px; font-size: 15px; font-family: inherit; color: var(--ink);
    background: var(--surface);
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 520px) { .row2 { grid-template-columns: 1fr; } }

  .upload-zone {
    border: 1.5px dashed var(--line); border-radius: 10px;
    padding: 20px; text-align: center; color: var(--ink-soft);
    font-size: 14px; cursor: pointer; background: var(--page);
  }
  .upload-zone.dragover { border-color: var(--accent); background: var(--accent-soft); }
  #fileList { margin-top: 10px; font-size: 13px; color: var(--ink-soft); }
  #fileList div { padding: 4px 0; }

  button.primary {
    width: 100%; padding: 13px; border: none; border-radius: 10px;
    background: var(--accent); color: #fff; font-size: 16px; font-weight: 600;
    cursor: pointer;
  }
  button.primary:disabled { opacity: .55; cursor: not-allowed; }
  button.primary:hover:not(:disabled) { background: #0c4a45; }

  .errbox {
    background: #fbeaea; color: #8a2c22; border-radius: 8px;
    padding: 10px 14px; font-size: 13px; margin-bottom: 16px; display: none;
  }

  .confirm { text-align: center; padding: 12px 4px 4px; }
  .confirm .check {
    width: 52px; height: 52px; border-radius: 50%; background: var(--accent-soft);
    color: var(--accent); display: flex; align-items: center; justify-content: center;
    font-size: 26px; margin: 0 auto 16px;
  }
  .confirm h2 { font-size: 19px; margin: 0 0 8px; }
  .confirm p { color: var(--ink-soft); font-size: 14px; margin: 0 0 4px; }
  .caseid {
    display: inline-block; margin-top: 14px; padding: 8px 14px;
    background: var(--page); border: 1px solid var(--line); border-radius: 8px;
    font-family: ui-monospace, monospace; font-size: 14px; letter-spacing: .02em;
  }

  .divider { border-top: 1px solid var(--line); margin: 28px 0 20px; }
  .test-note { font-size: 12px; color: var(--ink-soft); margin-bottom: 10px; }
  #statusResult { font-size: 13px; margin-top: 12px; white-space: pre-wrap;
    background: var(--page); border-radius: 8px; padding: 12px; display: none; }

  .hidden { display: none; }
</style>
</head>
<body>

<script>
// 前端跟後端部署在同一個 Cloud Run 服務裡（同一個容器），所以永遠用相對路徑、
// 同源呼叫即可，不用寫死網域。本機測試（uvicorn 跑在 localhost:8000）跟部署到
// Cloud Run 後（網址變成 https://xxx.run.app）都會自動打對地方。
const API_BASE = "";

// 保單照片跟理賠佐證文件是兩組獨立的上傳區，各自維護自己的檔案清單，
// 因為後端會分開送給 OCR（一個辨識保單號/姓名，一個辨識金額/日期）。
function setupUploadZone(zoneId, inputId, listId) {
  const zone = document.getElementById(zoneId);
  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);
  let files = [];

  zone.addEventListener("click", () => input.click());
  zone.addEventListener("dragover", e => { e.preventDefault(); zone.classList.add("dragover"); });
  zone.addEventListener("dragleave", () => zone.classList.remove("dragover"));
  zone.addEventListener("drop", e => {
    e.preventDefault(); zone.classList.remove("dragover");
    addFiles(e.dataTransfer.files);
  });
  input.addEventListener("change", () => addFiles(input.files));

  function addFiles(newFiles) {
    for (const f of newFiles) files.push(f);
    render();
  }
  function render() {
    list.innerHTML = files.map((f, i) =>
      `<div>${f.name}（${(f.size/1024).toFixed(1)} KB） <a href="#" data-i="${i}" class="rm" style="color:#8a2c22">移除</a></div>`
    ).join("");
    list.querySelectorAll(".rm").forEach(a => a.addEventListener("click", e => {
      e.preventDefault();
      files.splice(Number(a.dataset.i), 1);
      render();
    }));
  }

  return {
    getFiles: () => files,
    reset: () => { files = []; render(); },
    // 示範案例用：塞進去的不是使用者真的選的檔案，是純前端產生的極小佔位
    // 檔案（見下方 makeDemoFile），純粹是為了讓後端「有沒有上傳文件」的
    // 判斷能被誠實觸發（RSA Rule Agent 需要知道 policy_record／
    // service_request_record 是否存在），檔名會清楚標明是 demo 檔案，
    // 不會被誤認成真實文件。
    addSimulated: (newFiles) => addFiles(newFiles)
  };
}

const policyUpload = setupUploadZone("policyUploadZone", "policyFileInput", "policyFileList");
const evidenceUpload = setupUploadZone("uploadZone", "fileInput", "fileList");

// 純前端產生的極小佔位圖檔（1x1 透明 PNG），只用來讓「有沒有上傳文件」這件事
// 對後端來說是真的，不代表任何真實保單或救援單據內容。
function makeDemoFile(name) {
  const base64 = "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=";
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new File([bytes], name, { type: "image/png" });
}

function applyDemoCase(demoCase) {
  const form = document.getElementById("claimForm");
  const d = demoCase.data;
  form.policy_no.value = d.policy_no;
  form.applicant_name.value = d.applicant_name;
  form.insurance_type.value = d.insurance_type;
  form.policy_active.value = d.policy_active;
  form.rsa_addon_purchased.value = d.rsa_addon_purchased;
  form.claim_amount.value = d.claim_amount;
  form.incident_date.value = d.incident_date;
  form.description.value = d.description;
  form.contact_email.value = d.contact_email;
  form.contact_phone.value = d.contact_phone;

  // 先清空目前的上傳清單，需要附 demo 文件的案例再塞入佔位檔案；
  // 「資料不全」類的案例刻意不附文件，示範文件缺漏時的誠實轉人工。
  policyUpload.reset();
  evidenceUpload.reset();
  if (demoCase.attachDemoFiles) {
    policyUpload.addSimulated([makeDemoFile("demo_保單照片.png")]);
    evidenceUpload.addSimulated([makeDemoFile("demo_救援派工單.png")]);
  }

  // 若前一次示範已經送出過表單，重新顯示表單、隱藏成功畫面與錯誤訊息
  document.getElementById("confirmCard").classList.add("hidden");
  document.getElementById("formCard").classList.remove("hidden");
  const errBox = document.getElementById("errBox");
  errBox.style.display = "none";

  document.querySelectorAll(".demo-item").forEach(el => el.classList.remove("active"));
  const activeBtn = document.querySelector(`.demo-item[data-id="${demoCase.id}"]`);
  if (activeBtn) activeBtn.classList.add("active");
}

function renderDemoList() {
  const list = document.getElementById("demoList");
  list.innerHTML = DEMO_CASES.map(c => `
    <button type="button" class="demo-item" data-id="${c.id}">
      <span class="demo-tag ${c.tag}">${c.tagLabel}</span>
      <div class="demo-item-title">${c.title}</div>
      <div class="demo-item-desc">${c.desc}</div>
    </button>
  `).join("");
  list.querySelectorAll(".demo-item").forEach(btn => {
    btn.addEventListener("click", () => {
      const demoCase = DEMO_CASES.find(c => c.id === btn.dataset.id);
      if (demoCase) applyDemoCase(demoCase);
    });
  });
}
renderDemoList();

document.getElementById("demoResetBtn").addEventListener("click", () => {
  document.getElementById("claimForm").reset();
  policyUpload.reset();
  evidenceUpload.reset();
  document.getElementById("confirmCard").classList.add("hidden");
  document.getElementById("formCard").classList.remove("hidden");
  document.getElementById("errBox").style.display = "none";
  document.querySelectorAll(".demo-item").forEach(el => el.classList.remove("active"));
});

document.getElementById("claimForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errBox = document.getElementById("errBox");
  errBox.style.display = "none";

  const form = e.target;
  const email = form.contact_email.value.trim();
  const phone = form.contact_phone.value.trim();
  const policyFiles = policyUpload.getFiles();
  const evidenceFiles = evidenceUpload.getFiles();

  if (!email && !phone) {
    errBox.textContent = "email 與電話至少要留一項，否則無法通知您審核結果。";
    errBox.style.display = "block";
    return;
  }
  if (!form.policy_no.value.trim() && policyFiles.length === 0) {
    errBox.textContent = "請填寫保單號碼，或上傳保單照片讓系統自動辨識。";
    errBox.style.display = "block";
    return;
  }
  if (!form.applicant_name.value.trim() && policyFiles.length === 0) {
    errBox.textContent = "請填寫被保險人姓名，或上傳保單照片讓系統自動辨識。";
    errBox.style.display = "block";
    return;
  }
  if (!form.claim_amount.value && evidenceFiles.length === 0) {
    errBox.textContent = "請填寫申請理賠金額，或上傳收據／估價單讓系統自動辨識。";
    errBox.style.display = "block";
    return;
  }
  if (!form.incident_date.value && evidenceFiles.length === 0) {
    errBox.textContent = "請填寫事故／就醫日期，或上傳佐證文件讓系統自動辨識。";
    errBox.style.display = "block";
    return;
  }

  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.textContent = "送出中…";

  const fd = new FormData();
  fd.append("policy_no", form.policy_no.value);
  fd.append("applicant_name", form.applicant_name.value);
  fd.append("insurance_type", form.insurance_type.value);
  fd.append("policy_active", form.policy_active.value);
  fd.append("rsa_addon_purchased", form.rsa_addon_purchased.value);
  fd.append("claim_amount", form.claim_amount.value);
  fd.append("incident_date", form.incident_date.value);
  fd.append("description", form.description.value);
  fd.append("contact_email", email);
  fd.append("contact_phone", phone);
  fd.append("channel", "web");
  for (const f of policyFiles) fd.append("policy_documents", f);
  for (const f of evidenceFiles) fd.append("evidence_documents", f);

  try {
    const resp = await fetch(`${API_BASE}/v1/claims`, { method: "POST", body: fd });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.detail || `送出失敗（狀態碼 ${resp.status}）`);
    }
    const data = await resp.json();
    document.getElementById("caseIdDisplay").textContent = data.case_id;
    document.getElementById("formCard").classList.add("hidden");
    document.getElementById("confirmCard").classList.remove("hidden");
  } catch (err) {
    errBox.textContent = err.message || "送出時發生錯誤，請稍後再試。";
    errBox.style.display = "block";
  } finally {
    btn.disabled = false; btn.textContent = "送出申請";
  }
});

document.getElementById("lookupBtn").addEventListener("click", async () => {
  const caseId = document.getElementById("lookupInput").value.trim();
  const box = document.getElementById("statusResult");
  if (!caseId) return;
  box.style.display = "block";
  box.textContent = "查詢中…";
  try {
    const resp = await fetch(`${API_BASE}/v1/claims/${encodeURIComponent(caseId)}`);
    if (!resp.ok) { box.textContent = "查無此案件編號。"; return; }
    const data = await resp.json();
    box.textContent = JSON.stringify(data, null, 2);
  } catch {
    box.textContent = "查詢失敗，請確認 API 是否啟動。";
  }
});
</script>
