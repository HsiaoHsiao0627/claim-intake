<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>道路救援理賠申請（測試系統）</title>
<style>
  :root {
    --ink: #16232e;
    --ink-soft: #4a5b68;
    --line: #d8dee2;
    --surface: #ffffff;
    --page: #f3f6f7;
    --accent: #0f5c56;
    --accent-soft: #e3efed;
    --warn-bg: #fdf3e3;
    --warn-ink: #7a4a06;
    --err-bg: #fbeaea;
    --err-ink: #8a2c22;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-family: -apple-system, "Noto Sans TC", "PingFang TC", sans-serif;
    line-height: 1.6;
  }
  .page-layout {
    max-width: 1040px; margin: 0 auto; padding: 32px 20px 80px;
    display: flex; align-items: flex-start; gap: 24px;
  }
  .shell { max-width: 640px; flex: 1 1 auto; min-width: 0; }

  .demo-sidebar { width: 260px; flex: 0 0 260px; position: sticky; top: 24px; }
  .demo-card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px;
  }
  .demo-card .demo-badge {
    display: inline-block; font-size: 11px; letter-spacing: .04em;
    background: var(--accent-soft); color: var(--accent);
    padding: 3px 9px; border-radius: 999px; margin-bottom: 10px; font-weight: 600;
  }
  .demo-card h2 { font-size: 15px; margin: 0 0 6px; }
  .demo-card .demo-hint { font-size: 12px; color: var(--ink-soft); margin: 0 0 14px; }
  .demo-list { display: flex; flex-direction: column; gap: 8px; }
  .demo-item {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: var(--page); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font-family: inherit; color: var(--ink);
  }
  .demo-item:hover { border-color: var(--accent); }
  .demo-item.active { border-color: var(--accent); background: var(--accent-soft); }
  .demo-item .demo-item-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .demo-item .demo-item-desc { font-size: 11.5px; color: var(--ink-soft); line-height: 1.4; }
  .demo-tag {
    display: inline-block; font-size: 10.5px; font-weight: 600; letter-spacing: .02em;
    padding: 2px 7px; border-radius: 999px; margin-bottom: 6px;
  }
  .demo-tag.approve { background: var(--accent-soft); color: var(--accent); }
  .demo-tag.review { background: var(--warn-bg); color: var(--warn-ink); }
  .demo-tag.incomplete { background: var(--err-bg); color: var(--err-ink); }
  .demo-reset {
    width: 100%; margin-top: 12px; padding: 9px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft);
    font-size: 12.5px; cursor: pointer; font-family: inherit;
  }
  .demo-reset:hover { border-color: var(--ink-soft); }

  @media (max-width: 860px) {
    .page-layout { flex-direction: column; }
    .demo-sidebar { width: 100%; flex: 1 1 auto; position: static; }
  }
  header.top { margin-bottom: 28px; }
  header.top .badge {
    display: inline-block; font-size: 12px; letter-spacing: .04em;
    background: var(--warn-bg); color: var(--warn-ink);
    padding: 4px 10px; border-radius: 999px; margin-bottom: 12px;
  }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  header.top p { color: var(--ink-soft); margin: 0; font-size: 14px; }

  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 24px; margin-bottom: 20px;
  }
  .field { margin-bottom: 18px; }
  .field label {
    display: block; font-size: 13px; font-weight: 600;
    color: var(--ink-soft); margin-bottom: 6px;
  }
  .field input, .field select, .field textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 8px; font-size: 15px; font-family: inherit; color: var(--ink);
    background: var(--surface);
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 520px) { .row2 { grid-template-columns: 1fr; } }

  .upload-zone {
    border: 1.5px dashed var(--line); border-radius: 10px;
    padding: 20px; text-align: center; color: var(--ink-soft);
    font-size: 14px; cursor: pointer; background: var(--page);
  }
  .upload-zone.dragover { border-color: var(--accent); background: var(--accent-soft); }
  #fileList { margin-top: 10px; font-size: 13px; color: var(--ink-soft); }
  #fileList div { padding: 4px 0; }

  button.primary {
    width: 100%; padding: 13px; border: none; border-radius: 10px;
    background: var(--accent); color: #fff; font-size: 16px; font-weight: 600;
    cursor: pointer;
  }
  button.primary:disabled { opacity: .55; cursor: not-allowed; }
  button.primary:hover:not(:disabled) { background: #0c4a45; }

  .errbox {
    background: #fbeaea; color: #8a2c22; border-radius: 8px;
    padding: 10px 14px; font-size: 13px; margin-bottom: 16px; display: none;
  }

  .confirm { text-align: center; padding: 12px 4px 4px; }
  .confirm .check {
    width: 52px; height: 52px; border-radius: 50%; background: var(--accent-soft);
    color: var(--accent); display: flex; align-items: center; justify-content: center;
    font-size: 26px; margin: 0 auto 16px;
  }
  .confirm h2 { font-size: 19px; margin: 0 0 8px; }
  .confirm p { color: var(--ink-soft); font-size: 14px; margin: 0 0 4px; }
  .caseid {
    display: inline-block; margin-top: 14px; padding: 8px 14px;
    background: var(--page); border: 1px solid var(--line); border-radius: 8px;
    font-family: ui-monospace, monospace; font-size: 14px; letter-spacing: .02em;
  }

  .divider { border-top: 1px solid var(--line); margin: 28px 0 20px; }
  .test-note { font-size: 12px; color: var(--ink-soft); margin-bottom: 10px; }
  #statusResult { font-size: 13.5px; margin-top: 12px; line-height: 1.75;
    background: var(--page); border-radius: 8px; padding: 14px 16px; display: none; }
  #statusResult .claim-summary-row { margin-bottom: 4px; }
  #statusResult .claim-summary-decision { margin-top: 10px; padding: 10px 12px; border-radius: 8px; line-height: 1.6; }
  #statusResult .claim-summary-approve { background: var(--accent-soft); color: var(--accent); }
  #statusResult .claim-summary-review { background: var(--warn-bg); color: var(--warn-ink); }
  #statusResult .claim-summary-error { background: var(--err-bg); color: var(--err-ink); }
  #statusResult .claim-summary-pending { background: #eef1f2; color: var(--ink-soft); }
  #statusResult .claim-summary-raw { margin-top: 12px; font-size: 12px; color: var(--ink-soft); cursor: pointer; }
  #statusResult .claim-summary-raw pre { white-space: pre-wrap; word-break: break-all;
    background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
    padding: 10px; margin-top: 6px; cursor: text; font-size: 11.5px; }

  .hidden { display: none; }

</style>
</head>
<body>
<div class="page-layout">

  <aside class="demo-sidebar">
    <div class="demo-card">
      <span class="demo-badge">Demo 專用・僅供展示</span>
      <h2>案例代入</h2>
      <p class="demo-hint">點選下方案例，系統會自動代入對應申請資料，方便對主管機關展示各種審核情境。</p>
      <div class="demo-list" id="demoList"></div>
      <button type="button" class="demo-reset" id="demoResetBtn">清空表單</button>
    </div>
  </aside>

  <div class="shell">

  <header class="top">
    <span class="badge">測試系統・尚未上線</span>
    <h1>道路救援理賠申請</h1>
    <p>兆豐產物保險 × 東吳大學 理賠決策輔助平台</p>
    <p style="margin-top:10px;"><a href="/">← 回選擇頁</a>　｜　<a href="/tpl.html">切換到第三人責任險申請</a></p>
  </header>

  <div id="formCard" class="card">
    <div id="errBox" class="errbox"></div>
    <form id="claimForm">
      <input type="hidden" name="insurance_type" value="車險">
      <input type="hidden" name="channel" value="web">

      <div class="field">
        <label>保單照片（選填，系統會自動辨識保單號／被保險人姓名）</label>
        <div class="upload-zone" id="policyUploadZone">
          點擊選擇檔案，或將保單照片拖曳到這裡
          <input type="file" id="policyFileInput" name="policy_documents" multiple
                 accept=".pdf,.png,.jpg,.jpeg" style="display:none">
        </div>
        <div id="policyFileList"></div>
      </div>

      <div class="field">
        <label for="policy_no">保單號碼（未上傳保單照片時必填）</label>
        <input id="policy_no" name="policy_no" placeholder="例如 POL-2026-88901，或上傳保單照片讓系統自動帶入">
      </div>

      <div class="row2">
        <div class="field">
          <label for="applicant_name">被保險人姓名（未上傳保單照片時必填）</label>
          <input id="applicant_name" name="applicant_name" placeholder="或上傳保單照片讓系統自動帶入">
        </div>
        <div class="field">
          <label for="policy_active">保單於事故當下是否有效</label>
          <select id="policy_active" name="policy_active">
            <option value="">未確認／不確定</option>
            <option value="是">是，事故當下保單有效</option>
            <option value="否">否，保單已過期或未生效</option>
          </select>
        </div>
      </div>

      <div class="row2">
        <div class="field">
          <label for="rsa_addon_purchased">是否已投保道路救援附加條款</label>
          <select id="rsa_addon_purchased" name="rsa_addon_purchased">
            <option value="">未確認／不確定</option>
            <option value="是">是，已投保</option>
            <option value="否">否，未投保</option>
          </select>
        </div>
        <div class="field">
          <label for="claim_amount">申請理賠金額 (NT$)（未上傳佐證文件時必填）</label>
          <input id="claim_amount" name="claim_amount" type="number" min="0" step="1"
                 placeholder="或上傳收據／估價單讓系統自動帶入">
        </div>
      </div>

      <div class="field">
        <label for="incident_date">事故／就醫日期（未上傳佐證文件時必填）</label>
        <input id="incident_date" name="incident_date" type="date">
      </div>

      <div class="field">
        <label for="description">事故簡述（請說明車輛用途、救援服務類型、地點、道路類型、是否已聯絡指定救援中心等）</label>
        <textarea id="description" name="description" rows="3" placeholder="請簡述事故經過"></textarea>
      </div>

      <div class="row2">
        <div class="field">
          <label for="contact_email">聯絡 email</label>
          <input id="contact_email" name="contact_email" type="email" placeholder="用來通知審核結果">
        </div>
        <div class="field">
          <label for="contact_phone">聯絡電話</label>
          <input id="contact_phone" name="contact_phone" type="tel" placeholder="email 與電話至少填一項">
        </div>
      </div>

      <div class="field">
        <label>道路救援佐證文件（救援派工單、收據等，系統會自動辨識金額／日期，支援 PDF / PNG / JPG）</label>
        <div class="upload-zone" id="uploadZone">
          點擊選擇檔案，或將檔案拖曳到這裡
          <input type="file" id="fileInput" name="evidence_documents" multiple accept=".pdf,.png,.jpg,.jpeg" style="display:none">
        </div>
        <div id="fileList"></div>
      </div>

      <button type="submit" class="primary" id="submitBtn">送出申請</button>
    </form>
  </div>

  <div id="confirmCard" class="card confirm hidden">
    <div class="check">✓</div>
    <h2>已受理，審核中</h2>
    <p>您的理賠申請已成功送出，系統正在進行審核。</p>
    <p>審核完成後，我們會透過您留下的聯絡方式通知結果。</p>
    <div class="caseid" id="caseIdDisplay"></div>
  </div>

  <div class="divider"></div>
  <p class="test-note">測試用：正式版通知是 email／簡訊，此處僅供尚未接上真實通知服務前手動查詢進度。</p>
  <div class="card">
    <div class="field" style="margin-bottom:12px">
      <label for="lookupInput">輸入案件編號查詢進度</label>
      <input id="lookupInput" placeholder="例如 CLM-XXXXXXXXXX">
    </div>
    <button class="primary" id="lookupBtn" style="background:var(--ink-soft)">查詢</button>
    <div id="statusResult"></div>
  </div>

  </div>

</div>

<script src="common.js"></script>
