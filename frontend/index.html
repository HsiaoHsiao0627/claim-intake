<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>兆豐理賠申請（測試系統）</title>
<style>
  :root {
    --ink: #16232e;
    --ink-soft: #4a5b68;
    --line: #d8dee2;
    --surface: #ffffff;
    --page: #f3f6f7;
    --accent: #0f5c56;
    --accent-soft: #e3efed;
    --warn-bg: #fdf3e3;
    --warn-ink: #7a4a06;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-family: -apple-system, "Noto Sans TC", "PingFang TC", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 48px 20px 80px; }
  header.top { margin-bottom: 32px; }
  header.top .badge {
    display: inline-block; font-size: 12px; letter-spacing: .04em;
    background: var(--warn-bg); color: var(--warn-ink);
    padding: 4px 10px; border-radius: 999px; margin-bottom: 12px;
  }
  h1 { font-size: 24px; font-weight: 600; margin: 0 0 4px; }
  header.top p { color: var(--ink-soft); margin: 0; font-size: 14px; }

  .choice-hint { font-size: 14px; color: var(--ink-soft); margin: 0 0 24px; }

  .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 620px) { .choice-grid { grid-template-columns: 1fr; } }

  a.choice-card {
    display: block; text-decoration: none; color: inherit;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; padding: 28px 24px; transition: border-color .15s;
  }
  a.choice-card:hover { border-color: var(--accent); }
  .choice-card .choice-tag {
    display: inline-block; font-size: 11px; letter-spacing: .04em;
    background: var(--accent-soft); color: var(--accent);
    padding: 3px 9px; border-radius: 999px; margin-bottom: 14px; font-weight: 600;
  }
  .choice-card h2 { font-size: 18px; margin: 0 0 8px; }
  .choice-card p { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 16px; line-height: 1.6; }
  .choice-card .choice-cta { font-size: 13.5px; color: var(--accent); font-weight: 600; }
  .choice-card .choice-cta::after { content: " →"; }

  .divider { border-top: 1px solid var(--line); margin: 36px 0 20px; }
  .test-note { font-size: 12px; color: var(--ink-soft); }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <span class="badge">測試系統・尚未上線</span>
    <h1>理賠申請</h1>
    <p>兆豐產物保險 × 東吳大學 理賠決策輔助平台</p>
  </header>

  <p class="choice-hint">請選擇要申請的險種，兩種險種的表單欄位與審核流程不同：</p>

  <div class="choice-grid">
    <a class="choice-card" href="/rsa.html">
      <span class="choice-tag">RSA</span>
      <h2>道路救援</h2>
      <p>拖吊、電瓶救援、爆胎協助等道路救援服務理賠申請，需填寫保單有效性與是否投保道路救援附加條款。</p>
      <span class="choice-cta">前往申請</span>
    </a>
    <a class="choice-card" href="/tpl.html">
      <span class="choice-tag">TPL</span>
      <h2>第三人責任險</h2>
      <p>車禍事故中對第三人（人身或財物）造成損害的理賠申請，需說明事故經過與雙方責任歸屬。</p>
      <span class="choice-cta">前往申請</span>
    </a>
  </div>

  <div class="divider"></div>
  <p class="test-note">測試用：兩個頁面共用同一套受理 API 與後台審核系統，僅前端表單依險種分開呈現。</p>

</div>
</body>
</html>
